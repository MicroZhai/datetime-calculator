<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>时间计算器</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ====== 更新横幅 ====== -->
  <div id="update-banner" class="update-banner hidden">
    <span>发现新版本</span>
    <button id="update-btn" class="update-btn">更新</button>
  </div>

  <!-- ====== 时钟头部 ====== -->
  <header id="clock-header">
    <p class="clock-label">时间计算器</p>
    <div id="current-time-display" class="clock-time">--:--:--</div>
    <p id="current-date-display" class="clock-date"></p>
  </header>

  <!-- ====== 计算器列表 ====== -->
  <main id="calc-list" class="calc-list">
    <!-- JS 动态渲染卡片 -->
  </main>

  <!-- ====== 空状态提示 ====== -->
  <div id="empty-state" class="empty-state hidden">
    <div class="empty-icon">⏱️</div>
    <p>还没有计算器</p>
    <button id="empty-new-btn" class="btn-primary">新建第一个</button>
  </div>

  <!-- ====== 底部导航 + 新建按钮 ====== -->
  <nav id="bottom-nav" class="bottom-nav">
    <button id="nav-toggle" class="nav-item nav-item--active" data-nav="toggle">
      <span class="nav-icon" id="nav-toggle-icon">☰</span>
      <span class="nav-label" id="nav-toggle-label">简洁</span>
    </button>
    <button id="nav-history" class="nav-item" data-nav="history">
      <span class="nav-icon">🕘</span>
      <span class="nav-label">历史</span>
    </button>
    <button id="nav-settings" class="nav-item" data-nav="settings">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">设置</span>
    </button>
  </nav>

  <button id="new-btn-bottom" class="fab-btn" title="新建计算器" aria-label="新建计算器">＋</button>

  <!-- ====== 编辑弹窗（底部抽屉） ====== -->
  <div id="sheet-overlay" class="sheet-overlay hidden"></div>
  <div id="edit-sheet" class="edit-sheet">
    <div class="sheet-handle"></div>

    <div class="sheet-header">
      <h2 id="sheet-title">新建计算器</h2>
      <button id="sheet-close-btn" class="icon-btn" aria-label="关闭">✕</button>
    </div>

    <div class="sheet-body">
      <!-- 名称 -->
      <div class="form-group">
        <label for="input-name">名称</label>
        <input type="text" id="input-name" maxlength="30" placeholder="例如：会议结束时间">
      </div>

      <!-- 时段列表 -->
      <div class="form-group">
        <label>时段列表</label>
        <div id="segments-container">
          <!-- JS 动态渲染时段编辑器 -->
        </div>
        <button id="add-segment-btn" class="btn-add-segment">+ 添加时段</button>
      </div>

      <!-- 时长历史 -->
      <div class="form-group">
        <label>历史时长（填入当前时段）</label>
        <div id="duration-history" class="quick-durations">
          <!-- JS 动态渲染 -->
        </div>
      </div>
    </div>

    <div class="sheet-footer">
      <button id="save-btn" class="btn-primary">保存</button>
      <button id="delete-btn" class="btn-danger hidden">删除此计算器</button>
    </div>
  </div>

  <!-- ====== 设置弹窗 ====== -->
  <div id="settings-overlay" class="sheet-overlay hidden"></div>
  <div id="settings-sheet" class="edit-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2>设置</h2>
      <button id="settings-close-btn" class="icon-btn" aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <!-- 深色模式 -->
      <div class="settings-row">
        <div class="settings-row-icon">🌓</div>
        <div class="settings-row-main">
          <div class="settings-row-title">深色模式</div>
          <div class="settings-row-desc">跟随系统 / 浅色 / 深色</div>
        </div>
        <select id="settings-theme-select" class="settings-select">
          <option value="auto">跟随系统</option>
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select>
      </div>

      <!-- 提醒设置 -->
      <div class="settings-row">
        <div class="settings-row-icon">🔔</div>
        <div class="settings-row-main">
          <div class="settings-row-title">到期提醒</div>
          <div class="settings-row-desc" id="settings-reminder-desc">未开启</div>
        </div>
        <button id="settings-reminder-btn" class="btn-now-inline">设置</button>
      </div>

      <!-- 关于 -->
      <div class="settings-row">
        <div class="settings-row-icon">ℹ️</div>
        <div class="settings-row-main">
          <div class="settings-row-title">关于</div>
          <div class="settings-row-desc">版本 1.0.0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== 提醒设置弹窗 ====== -->
  <div id="reminder-overlay" class="sheet-overlay hidden"></div>
  <div id="reminder-sheet" class="edit-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2>到期提醒</h2>
      <button id="reminder-close-btn" class="icon-btn" aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <div class="form-group">
        <label>开启提醒</label>
        <div class="settings-row">
          <div class="settings-row-main">
            <div class="settings-row-desc">在计算器结束前提醒您</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="reminder-enabled">
            <span class="switch-slider"></span>
          </label>
        </div>
      </div>
      <div class="form-group">
        <label>提前提醒</label>
        <select id="reminder-lead" class="form-select">
          <option value="0">结束时</option>
          <option value="5">提前 5 分钟</option>
          <option value="10">提前 10 分钟</option>
          <option value="15">提前 15 分钟</option>
          <option value="30">提前 30 分钟</option>
          <option value="60">提前 1 小时</option>
        </select>
      </div>
      <p class="reminder-note">说明：当应用处于打开状态时，提醒会准时弹出。浏览器在后台或锁屏时可能无法弹窗，这是浏览器的安全限制。</p>
    </div>
  </div>

  <!-- ====== 历史弹窗 ====== -->
  <div id="history-overlay" class="sheet-overlay hidden"></div>
  <div id="history-sheet" class="edit-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2>计算历史</h2>
      <button id="history-close-btn" class="icon-btn" aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body" id="history-list">
      <!-- JS 动态渲染 -->
    </div>
    <div class="sheet-footer">
      <button id="clear-history-btn" class="btn-danger">清空全部历史</button>
    </div>
  </div>

  <!-- ====== 右键菜单（卡片上的 ⋮） ====== -->
  <div id="context-menu" class="context-menu hidden">
    <button id="ctx-pin">📌 置顶</button>
    <button id="ctx-rename">✏️ 重命名</button>
    <button id="ctx-copy-detail">📋 复制计算详情</button>
    <button id="ctx-delete">🗑️ 删除</button>
  </div>

  <!-- ====== 确认弹窗 ====== -->
  <div id="confirm-overlay" class="confirm-overlay hidden"></div>
  <div id="confirm-dialog" class="confirm-dialog">
    <p id="confirm-msg" class="confirm-msg"></p>
    <div class="confirm-btns">
      <button id="confirm-cancel-btn" class="confirm-btn confirm-btn--cancel">取消</button>
      <button id="confirm-ok-btn" class="confirm-btn confirm-btn--danger">删除</button>
    </div>
  </div>

  <!-- ====== Toast 提示 ====== -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/storage.js"></script>
  <script src="js/history.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/notification.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ui-render.js"></script>
  <script src="js/ui-sheet.js"></script>
  <script src="js/ui-history.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
