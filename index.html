<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="themeColorMeta" content="#F1F3F5">
<meta name="description" content="像普通计算器一样进行时长加减：支持天、时、分、秒、基准日期推算、冒号快捷输入、多行表达式编辑与历史恢复。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
(() => {
  try {
    const stored = localStorage.getItem('dtc-theme');
    if (stored === 'light' || stored === 'dark') document.documentElement.dataset.theme = stored;
    const dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.getElementById('themeColorMeta').content = dark ? '#000000' : '#F1F3F5';
  } catch (_) {}
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>时间计算器</title>
<link rel="stylesheet" href="css/duration-calculator.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/date-anchor.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/keypad-surface.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div aria-hidden="true"></div>
    <div class="title">时间计算器</div>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" type="button" aria-label="主题：跟随系统" title="主题：跟随系统" aria-haspopup="menu" aria-expanded="false" aria-controls="themeMenu">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="7.5"/>
          <path d="M12 4.5a7.5 7.5 0 0 1 0 15z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button class="icon-btn" id="historyBtn" type="button" aria-label="计算历史" title="计算历史">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4.75 7.75V3.9M4.75 7.75H8.6M4.75 7.75A8 8 0 1 1 4 15.15"/>
          <path d="M12 7.5V12l3 1.8"/>
        </svg>
      </button>
    </div>
    <div class="theme-menu" id="themeMenu" role="menu" aria-label="主题模式" hidden>
      <button class="theme-option" type="button" role="menuitemradio" aria-checked="true" data-theme-option="system">
        <span>跟随系统</span><span class="theme-check" aria-hidden="true">✓</span>
      </button>
      <button class="theme-option" type="button" role="menuitemradio" aria-checked="false" data-theme-option="light">
        <span>浅色</span><span class="theme-check" aria-hidden="true">✓</span>
      </button>
      <button class="theme-option" type="button" role="menuitemradio" aria-checked="false" data-theme-option="dark">
        <span>深色</span><span class="theme-check" aria-hidden="true">✓</span>
      </button>
    </div>
  </header>

  <main>
    <section class="display-region" aria-label="计算内容">
      <div class="status-row" aria-live="polite"><span class="badge" id="badge">输入数字，再选择单位</span></div>

      <div class="expr-scroll" id="exprScroll">
        <div id="expression"></div>
      </div>

      <div class="row-actions" id="rowActions">
        <span class="label" id="rowActionLabel">已选择一行</span>
        <button class="small-btn toggle" id="toggleOpBtn" type="button">切换加减</button>
        <button class="small-btn danger" id="deleteRowBtn" type="button">删除行</button>
        <button class="small-btn" id="doneRowBtn" type="button">完成</button>
      </div>

      <div class="normalized" id="normalized"></div>
      <div class="result-group" aria-live="polite" aria-atomic="true">
        <div class="result" id="result">0分</div>
        <div class="secondary" id="secondary">00:00:00</div>
      </div>
      <div class="error-line" id="errorLine" role="status" aria-live="polite"></div>

      <div class="format-row">
        <div class="format-switch" role="radiogroup" aria-label="结果显示方式">
          <button class="format-option active" data-format="0" type="button" role="radio" aria-checked="true">天时分秒</button>
          <button class="format-option" data-format="1" type="button" role="radio" aria-checked="false">小时</button>
          <button class="format-option" data-format="2" type="button" role="radio" aria-checked="false">分</button>
        </div>
      </div>
    </section>

    <section class="keypad-region" aria-label="计算键盘">
      <div class="keypad">
        <button class="key unit k-day" data-unit="d" type="button" aria-keyshortcuts="D">天</button>
        <button class="key unit k-hour" data-unit="h" type="button" aria-keyshortcuts="H">时</button>
        <button class="key unit k-minute" data-unit="m" type="button" aria-keyshortcuts="M">分</button>
        <button class="key unit k-second" data-unit="s" type="button" aria-keyshortcuts="S">秒</button>

        <button class="key util danger-text k-clear" data-action="clear" type="button">清空</button>
        <button class="key util k-back" data-action="back" type="button" aria-label="退格" aria-keyshortcuts="Backspace">⌫</button>
        <button class="key colon-key k-colon" data-action="colon" type="button" aria-label="冒号输入" aria-keyshortcuts=":">:</button>
        <button class="key op k-minus" data-op="-" type="button" aria-label="减" aria-keyshortcuts="-">−</button>

        <button class="key k7" data-digit="7" type="button">7</button>
        <button class="key k8" data-digit="8" type="button">8</button>
        <button class="key k9" data-digit="9" type="button">9</button>
        <button class="key op k-plus" data-op="+" type="button" aria-label="加" aria-keyshortcuts="+">+</button>

        <button class="key k4" data-digit="4" type="button">4</button>
        <button class="key k5" data-digit="5" type="button">5</button>
        <button class="key k6" data-digit="6" type="button">6</button>
        <button class="key equal k-equal" data-action="equals" type="button" aria-label="计算" aria-keyshortcuts="Enter =">=</button>

        <button class="key k1" data-digit="1" type="button">1</button>
        <button class="key k2" data-digit="2" type="button">2</button>
        <button class="key k3" data-digit="3" type="button">3</button>

        <button class="key k0" data-digit="0" type="button">0</button>
        <button class="key k00" data-digit="00" type="button">00</button>
        <button class="key kdot" data-digit="." type="button" aria-label="小数点">.</button>
      </div>
      <p class="hint">按 = 保存到历史；历史记录可恢复后继续编辑。</p>
    </section>
  </main>
</div>

<div class="history-mask" id="historyMask">
  <section class="history-sheet" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
    <div class="history-head">
      <button class="history-head-btn" id="closeHistoryBtn" type="button">关闭</button>
      <div class="history-title" id="historyTitle">计算历史</div>
      <button class="history-head-btn danger" id="clearHistoryBtn" type="button">清空</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="undo-bar" id="undoBar" role="status" aria-live="polite" aria-atomic="true">
  <span id="undoMessage"></span>
  <button id="undoButton" type="button">撤销</button>
</div>
<script src="js/duration-core.js"></script>
<script src="js/duration-ui.js"></script>
<script src="js/duration-app.js"></script>
<script src="js/date-anchor.js"></script>
<script src="js/theme.js"></script>
<script>
(() => {
  if (!('serviceWorker' in navigator)) return;

  let registration = null;
  let reloadingForUpdate = false;
  let refreshPending = false;

  function canApplyUpdateNow() {
    try {
      const inputActive = numberBuffer !== '' || colonMode || currentParts.length > 0 ||
        currentOp !== null || selectedRow !== null || partEdit !== null;
      const dateOnly = rows.length === 0 && Boolean(document.querySelector('.date-anchor.has-date'));
      const unfinishedExpression = (rows.length > 0 && !justEvaluated) || dateOnly;
      return !inputActive && !unfinishedExpression;
    } catch (_) {
      return true;
    }
  }

  function applyUpdateWhenSafe() {
    if (reloadingForUpdate) return;
    if (canApplyUpdateNow()) {
      reloadingForUpdate = true;
      location.reload();
      return;
    }

    refreshPending = true;
    if (typeof notify === 'function') {
      notify('新版本已就绪，完成当前计算后自动刷新');
    }
  }

  async function checkForUpdate() {
    try {
      registration = registration || await navigator.serviceWorker.register('./sw.js', {
        updateViaCache: 'none'
      });
      await registration.update();
    } catch (_) {}
  }

  navigator.serviceWorker.addEventListener('controllerchange', applyUpdateWhenSafe);

  window.addEventListener('load', checkForUpdate);
  window.addEventListener('pageshow', checkForUpdate);
  window.addEventListener('online', checkForUpdate);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) checkForUpdate();
  });

  window.setInterval(() => {
    if (!document.hidden) checkForUpdate();
  }, 60000);

  window.setInterval(() => {
    if (refreshPending && canApplyUpdateNow()) applyUpdateWhenSafe();
  }, 1000);
})();
</script>
</body>
</html>
